function showErr(m){const a=$('#app');if(a&&!a.children.length)a.innerHTML='<div style="padding:40px;font-family:sans-serif;max-width:640px;margin:auto"><h2>Something went wrong</h2><pre style="white-space:pre-wrap;background:#f3f4f6;padding:12px;border-radius:8px">'+esc(m)+'</pre><p><button onclick="location.reload()">Retry</button> <a href="/">Home</a></p></div>'}
addEventListener('unhandledrejection',e=>showErr(String((e.reason&&e.reason.message)||e.reason)));addEventListener('error',e=>showErr(e.message));
async function route(){document.body.style.overflow='';
 const dec=x=>{try{return decodeURIComponent(x)}catch(e){return x}};
 try{
 if(location.hash.startsWith('#/')){ // legacy hash URLs -> clean URLs
  const hs=location.hash.slice(2).split('/').map(dec).filter(Boolean);let lg=L,path;
  if(hs[0]==='c'){let cs=hs[1];if(hs.length>2){lg=hs[1];cs=hs[2]}path=PL(lg)+encodeURIComponent(cs||'')}
  else if(hs[0]==='a')path=PL(hs[1])+encodeURIComponent(hs[2]||'');
  else if(hs[0]==='admin')path='/'+hs.map(encodeURIComponent).join('/');
  else path=PL(lg)+hs.map(encodeURIComponent).join('/');
  history.replaceState(null,'',path)}
 const seg=location.pathname.split('/').filter(Boolean).map(dec);let lang='en';if(seg[0]==='ur'){lang='ur';seg.shift()}
 const isAd=seg[0]==='admin';if(!isAd)L=lang;
 document.documentElement.lang=L;document.documentElement.dir=L==='ur'?'rtl':'ltr';
 await ensureCats();R={seg,admin:isAd,type:'other'};const q=new URLSearchParams(location.search);
 if(!seg.length){R.type='home';return home()}
 if(isAd)return admin(seg.slice(1).join('/'));
 if(seg[0]==='p'&&seg.length===2)return page(seg[1]);
 if(seg[0]==='s')return search(seg[1]||q.get('q')||'');
 if(seg[0]==='popular'){R.type='home';return home()}
 if(seg[0]==='newsletter'){R.type='home';await home();return $('#nl')&&$('#nl').scrollIntoView()}
 if(seg.length===1&&CATS.some(c=>c.slug===seg[0])){R.type='cat';return category(seg[0])}
 if(seg.length===2){const c0=CATS.find(x=>x.slug===seg[0]);if(c0&&SUBS.some(x=>x.category_id===c0.id&&x.slug===seg[1])){R.type='cat';return subcategory(seg[0],seg[1])}}
 if(seg.length<=2){R.type='article';return article(L,seg[seg.length-1])}
 return notFound()
 }catch(e){console.error(e);const k=location.pathname;if(window.__rk!==k){window.__rk=k;window.__rc=0}if(++window.__rc<=2){setTimeout(route,1500);return}toast(e.message||'Error',1);showErr(e.message)}}
addEventListener('popstate',route);addEventListener('hashchange',route);
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target==='_blank')return;
 const h=a.getAttribute('href');if(!h.startsWith('/')||h.startsWith('//')||/\.[a-z0-9]+$/i.test(h.split('?')[0]))return;e.preventDefault();if(a.closest('.dr'))drawer(0);

route();
